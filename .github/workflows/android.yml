# ANDROID PAKETİ (Play Store) — bulutta derlenir; bu bilgisayara Java/Android SDK kurulmaz.
#
# Ne zaman çalışır:
#  - Android tarafı (android/, capacitor.config.ts, paketler, bu dosya) değişip main'e gönderilince
#  - GitHub → Actions → "Android (Play paketi)" → Run workflow ile elle
#
# Çıktılar (çalıştırmanın sayfasında "Artifacts" bölümünde):
#  - jilted-play-aab   : Play Console'a yüklenecek İMZALI paket (.aab)
#  - jilted-test-apk   : telefona doğrudan kurup denemek için (debug, imzasız test sürümü)
#
# Gizliler (repo → Settings → Secrets and variables → Actions):
#  - UPLOAD_KEY_P12_BASE64, UPLOAD_KEY_PASSWORD : yükleme anahtarı (yoksa AAB İMZASIZ çıkar → Play kabul etmez)
#  - ADMOB_APP_ID                              : AdMob uygulama kimliği (yoksa Google TEST kimliği)
name: Android (Play paketi)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "cap-www/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Paketleri kur
        run: npm ci

      - name: Capacitor eşitle (eklentiler + yedek sayfa)
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Yükleme anahtarını yerleştir (varsa)
        env:
          P12: ${{ secrets.UPLOAD_KEY_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "$P12" | base64 -d > android/app/upload-key.p12
            echo "Anahtar bulundu: AAB imzalanacak."
          else
            echo "::warning::UPLOAD_KEY_P12_BASE64 gizlisi yok — AAB imzasız çıkacak (Play kabul etmez). Test APK yine çalışır."
          fi

      - name: Derle (AAB + test APK)
        working-directory: android
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          chmod +x gradlew
          ARGS="-PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}"
          if [ -n "$ADMOB_APP_ID" ]; then ARGS="$ARGS -PadmobAppId=$ADMOB_APP_ID"; fi
          ./gradlew bundleRelease assembleDebug $ARGS --no-daemon --stacktrace

      - name: Anahtarı sil
        if: always()
        run: rm -f android/app/upload-key.p12

      - uses: actions/upload-artifact@v4
        with:
          name: jilted-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: jilted-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
