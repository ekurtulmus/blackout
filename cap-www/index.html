<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dark Maze: Jilted</title>
<style>
  html, body { margin: 0; height: 100%; background: #050304; color: #e8dcc6; font-family: Georgia, serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 34px; letter-spacing: .2em; margin: 0; color: #efe7d6; }
  p { margin: 0; color: #a99c84; font-size: 16px; line-height: 1.6; max-width: 320px; }
  button { margin-top: 8px; background: #e6d7b8; color: #2a1a12; border: 0; font: 600 18px Georgia, serif; padding: 12px 30px; }
</style>
</head>
<body>
  <!-- Uygulama oyunu canlı siteden yükler (capacitor.config.ts server.url). Bu sayfa
       yalnız internet yokken görünür. -->
  <h1>JILTED</h1>
  <p id="m">Fenerin söndü. Oyun için internet bağlantısı gerekiyor.</p>
  <button onclick="location.href='https://jilted.vercel.app'">Tekrar dene</button>
  <script>
    if (!/^tr/i.test(navigator.language || "")) {
      document.getElementById("m").textContent = "Your lantern went out. The game needs an internet connection.";
      document.querySelector("button").textContent = "Try again";
    }
  </script>
</body>
</html>
